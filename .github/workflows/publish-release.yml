name: Publish Release

# Releases are cut from develop and tag-driven: one release per AOSC version (tag v<version>)
# containing every per-minor zip for both OpenSearch lines. The version is derived from the
# latest v* tag + the chosen bump, so develop's version.properties stays 0.0.0-dev.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for this release (from the latest v* tag)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.meta.outputs.next_version }}
      sha: ${{ steps.meta.outputs.sha }}
      build_matrix_json: ${{ steps.meta.outputs.build_matrix_json }}
      release_compat_matrix_json: ${{ steps.meta.outputs.release_compat_matrix_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop
      - id: meta
        run: |
          git fetch --tags --force origin
          NEXT="$(./scripts/ci-metadata.py --next-version "${{ inputs.bump }}")"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_matrix_json=$(./scripts/ci-metadata.py all --build-matrix)" >> "$GITHUB_OUTPUT"
          echo "release_compat_matrix_json=$(./scripts/ci-metadata.py all --release-compat-matrix)" >> "$GITHUB_OUTPUT"
      - name: Guard version is fresh
        env:
          NEXT: ${{ steps.meta.outputs.next_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEXT}" >/dev/null 2>&1 \
             || gh release view "v${NEXT}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v${NEXT} already exists — bump differently or delete the stale tag/release." >&2
            exit 1
          fi

  validation:
    name: Release validation
    needs: metadata
    uses: ./.github/workflows/components.yml
    with:
      os_line: all
      tier: full
      include_docs: true
      ref: ${{ needs.metadata.outputs.sha }}
      artifact_retention_days: 14

  build:
    name: Build os${{ matrix.opensearch_version }} zip
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.build_matrix_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.build_java_version }}
          cache: gradle
      - name: Select Gradle for the OpenSearch version
        run: ./scripts/set-gradle.sh "${{ matrix.opensearch_version }}"
      - name: Pre-fetch Gradle
        run: ./scripts/ensure-gradle.sh
      - name: Build per-minor zip
        env:
          OS_VERSION: ${{ matrix.opensearch_version }}
          NEXT: ${{ needs.metadata.outputs.next_version }}
        run: |
          ./scripts/gradle-with-retry.sh ./gradlew --no-daemon bundlePlugin \
            -PopensearchVersion="${OS_VERSION}" -PaoscVersion="${NEXT}"
          MINOR="${OS_VERSION%.*}"
          SRC="$(ls aosc-plugin-*/build/distributions/opensearch-aosc-${NEXT}.zip)"
          mkdir -p dist
          cp "${SRC}" "dist/opensearch-aosc-${NEXT}-os${MINOR}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: relzip-${{ matrix.opensearch_version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release-compat:
    # Install the EXACT published zip (the relzip-* artifact from the build job, built at
    # build_version with descriptor ~X.Y.0) onto a Docker node at each boundary patch of the minor
    # and run the docker smoke suite. This validates the real shipped bytes across the patches they
    # claim to support — the rebuild-per-patch validation matrix never installs the shipped zip on
    # a higher patch, and rebuilding here would only test an equivalent rebuild, not the artifact.
    name: Compat ${{ matrix.opensearch_version }} zip on ${{ matrix.container_version }}
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.release_compat_matrix_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.build_java_version }}
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          pattern: relzip-*
          path: dist
          merge-multiple: true
      - name: Select Gradle for the OpenSearch version
        run: ./scripts/set-gradle.sh "${{ matrix.opensearch_version }}"
      - name: Pre-fetch Gradle
        run: ./scripts/ensure-gradle.sh
      - name: Smoke the published zip on the patch container
        env:
          BUILD_VERSION: ${{ matrix.opensearch_version }}
          CONTAINER_VERSION: ${{ matrix.container_version }}
          NEXT: ${{ needs.metadata.outputs.next_version }}
        run: |
          MINOR="${BUILD_VERSION%.*}"
          ZIP="dist/opensearch-aosc-${NEXT}-os${MINOR}.zip"
          if [[ ! -f "${ZIP}" ]]; then
            echo "Published zip not found: ${ZIP}" >&2
            ls -R dist >&2 || true
            exit 1
          fi
          # -Ptests.docker.pluginZip installs the downloaded artifact (no rebuild). The build
          # version still selects the module + compiles the smoke harness; the container runs the patch.
          ./scripts/gradle-with-retry.sh ./gradlew --no-daemon smokeTestDocker \
            -PopensearchVersion="${BUILD_VERSION}" \
            -Ptests.docker.opensearchVersion="${CONTAINER_VERSION}" \
            -Ptests.docker.pluginZip="${ZIP}"

  publish:
    name: Publish release
    needs:
      - metadata
      - validation
      - build
      - release-compat
    if: ${{ needs.metadata.result == 'success' && needs.validation.result == 'success' && needs.build.result == 'success' && needs.release-compat.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      NEXT: ${{ needs.metadata.outputs.next_version }}
      SHA: ${{ needs.metadata.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: relzip-*
          path: dist
          merge-multiple: true
      - name: Checksums + release notes
        run: |
          cd dist
          shasum -a 256 *.zip > SHA256SUMS
          {
            echo "# v${NEXT}"
            echo
            echo "AOSC ${NEXT} — plugin builds for OpenSearch 2.x and 3.x."
            echo
            echo "Download the zip matching your OpenSearch minor:"
            for z in $(ls *.zip | sort); do echo "- ${z}"; done
            echo
            echo "Docs: https://atlassian-labs.github.io/opensearch-aosc/${NEXT}/"
            echo
            echo "Released from develop @ ${SHA}"
            echo
            echo "Checksums in \`SHA256SUMS\`."
          } > RELEASE_NOTES.md
      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - name: Create release (creates tag v<version> at the develop SHA)
        run: |
          gh release create "v${NEXT}" --target "${SHA}" --title "v${NEXT}" \
            --notes-file dist/RELEASE_NOTES.md dist/*.zip dist/SHA256SUMS

  deploy_docs:
    name: Deploy release docs
    needs:
      - metadata
      - publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install docs dependencies
        run: npm ci
      - name: Deploy release docs
        run: scripts/deploy-docs-version.sh --version "${{ needs.metadata.outputs.next_version }}"
