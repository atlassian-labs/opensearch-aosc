 * SPDX-License-Identifier: Apache-2.0
 *
 * Aggregator root build for the AOSC plugin family.
 * Real build logic lives in each subproject's build.gradle.
 */

buildscript {
    ext {
        // Resolved + validated once in settings.gradle (single source), shared via gradle.ext.
        opensearch_version = gradle.ext.aoscOsVersion
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        // AWS OSS Sonatype snapshots intermittently 504 and fail configuration; restrict it to
        // snapshot artifacts (and prefer mavenCentral above) so release resolution never hits it.
        maven {
            url "https://aws.oss.sonatype.org/content/repositories/snapshots"
            mavenContent {
                snapshotsOnly()
            }
        }
    }

    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
        classpath "com.diffplug.spotless:spotless-plugin-gradle:6.25.0"
    }
}

def aoscVersionProperties = new Properties()
file("version.properties").withInputStream { aoscVersionProperties.load(it) }

allprojects {
    // aoscVersion may be overridden at release time via -PaoscVersion (see release commit).
    version = findProperty("aoscVersion") ?: aoscVersionProperties.getProperty("aoscVersion")
    // Selected OpenSearch version, resolved once in settings.gradle and shared to each module's
    // applied build script (gradle/aosc-plugin.gradle reads project.opensearch_version).
    ext.opensearch_version = gradle.ext.aoscOsVersion
}
