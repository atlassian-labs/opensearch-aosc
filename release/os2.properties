line=os2
primary_version=2.19.0
# build_versions = one zip per supported minor (built at X.Y.0; descriptor ~X.Y.0 covers the
# whole minor). Keep it aligned with the minors in test_versions so every validated minor ships
# an installable artifact. test_versions = every released patch we validate against.
build_versions=2.15.0,2.16.0,2.17.0,2.18.0,2.19.0
test_versions=2.15.0,2.16.0,2.17.0,2.17.1,2.18.0,2.19.0,2.19.1,2.19.2,2.19.3,2.19.4,2.19.5,2.19.6
# target_java_version = bytecode target + plugin-descriptor java.version (what the plugin runs on).
# build_java_version = the JVM that RUNS the build (Gradle JVM). 2.x targets Java 11 but its
# newer build-tools (e.g. 2.19.6) ships Java-17 classes, so the build itself needs JDK 17;
# sourceCompatibility=11 keeps the emitted bytecode at 11.
target_java_version=11
build_java_version=17

# --- Build data consumed by gradle/aosc-plugin.gradle (single source of truth) ---
# 2.x build-tools do not ship the opensearch.java-agent plugin.
java_agent=false

# Gradle version required to build each minor. 2.x build-tools runs on Gradle 8.x (breaks on 9.x),
# so the whole 2.x line stays on 8.7. Resolved by scripts/ci-metadata.py --gradle-version / aoscw.
gradle_version=8.7

# Jackson shipped by each supported minor (must match, or NoSuchMethodError at runtime).
# Verified against OpenSearch buildSrc/version.properties per minor.
jackson_databind.2.15=2.17.1
jackson_databind.2.16=2.17.2
jackson_databind.2.17=2.17.2
jackson_databind.2.18=2.17.2
jackson_databind.2.19=2.18.2
jackson_annotations.2.15=2.17.1
jackson_annotations.2.16=2.17.2
jackson_annotations.2.17=2.17.2
jackson_annotations.2.18=2.17.2
jackson_annotations.2.19=2.18.2

# yamlRestTest error_prone_annotations pin for exact versions that hit the framework conflict.
error_prone.2.19.5=2.45.0
error_prone.2.19.6=2.45.0
