line=os3
primary_version=3.7.0
# build_versions = one zip per supported minor (built at X.Y.0; descriptor ~X.Y.0 covers the
# whole minor). Keep it aligned with the minors in test_versions so every validated minor ships
# an installable artifact. test_versions = every released patch we validate against.
build_versions=3.0.0,3.1.0,3.2.0,3.3.0,3.4.0,3.5.0,3.6.0,3.7.0
test_versions=3.0.0,3.1.0,3.2.0,3.3.0,3.3.1,3.3.2,3.4.0,3.5.0,3.6.0,3.7.0
target_java_version=21
build_java_version=21

# --- Build data consumed by gradle/aosc-plugin.gradle (single source of truth) ---
# 3.x tests run under the opensearch.java-agent (ships only with 3.x build-tools).
java_agent=true

# Gradle version required to build each minor (OpenSearch build-tools pins a min Gradle, and old
# build-tools break on newer Gradle). Default covers 2.15-3.6; 3.7 build-tools requires >=9.4.1.
# Resolved per-version by scripts/ci-metadata.py --gradle-version and scripts/aoscw.
gradle_version=8.7
gradle_version.3.7=9.4.1

# Jackson shipped by each supported minor (must match, or NoSuchMethodError at runtime).
# databind and annotations tracked separately (e.g. 3.5 ships databind 2.20.1 but annotations 2.20).
# Verified against OpenSearch gradle/libs.versions.toml per minor (3.6 pre-declared).
jackson_databind.3.0=2.18.2
jackson_databind.3.1=2.18.2
jackson_databind.3.2=2.18.2
jackson_databind.3.3=2.18.2
jackson_databind.3.4=2.18.2
jackson_databind.3.5=2.20.1
jackson_databind.3.6=2.21.2
jackson_databind.3.7=2.21.3
jackson_annotations.3.0=2.18.2
jackson_annotations.3.1=2.18.2
jackson_annotations.3.2=2.18.2
jackson_annotations.3.3=2.18.2
jackson_annotations.3.4=2.18.2
jackson_annotations.3.5=2.20
jackson_annotations.3.6=2.21
jackson_annotations.3.7=2.21

# yamlRestTest error_prone_annotations pin for exact versions that hit the framework conflict.
error_prone.3.5.0=2.45.0
error_prone.3.6.0=2.45.0
error_prone.3.7.0=2.45.0
